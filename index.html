 приведены по тексту самих хадисов."],vv="Время: после намаза фаджр и до восхода солнца; большинство учёных допускают чтение до полудня (зухр). Пропущенное восполняется.",yv="Время: после ‘асра, после магриба и до первой трети ночи; часть зикров читается перед сном. Пропущенное восполняется.",M1="قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾",D1="قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾",U1="قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾",N1=`Куль хува-Лла̄ху ахад. Алла̄ху-с-Самад. Лям ялид ва лям ю̄ляд. Ва лям якун ля̄ху куфуван ахад.
Куль а‘ӯзу би-Рабби-ль-фаляк. Мин шарри ма̄ х̣аляк. Ва мин шарри га̄сикъин иза̄ вакъаб. Ва мин шарри-н-наффа̄та̄ти фӣ-ль-‘укад. Ва мин шарри ха̄сидин иза̄ х̣асад.
Куль а‘ӯзу би-Рабби-н-на̄с. Ма̄лики-н-на̄с. Иля̄хи-н-на̄с. Мин шарри-ль-васва̄си-ль-ханна̄с, аллязӣ ювасвису фӣ суда̄ри-н-на̄с, мина-ль-джиннати ва-н-на̄с.`,j1="«Скажи: „Он — Аллах, Единый. Аллах — ас-Самад (Вечный, Самодостаточный). Он не родил и не был рождён. И нет никого, равного Ему“». «Скажи: „Прибегаю к Господу рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла дующих на узлы и от зла завистника, когда он завидует“». «Скажи: „Прибегаю к Господу людей, Царю людей, Богу людей, от зла нашёптывающего отступающего, который нашёптывает в груди людей, — из джиннов и людей“».",_1=[{id:"u-1",code:"У-1",title:"Три суры: аль-Ихлас, аль-Фаляк, ан-Нас",repsShort:"по 3 раза",arabic:[M1,D1,U1],translit:N1,translation:j1,when:"утром и вечером; также перед сном",repeats:"по 3 раза утром и вечером",reward:"«Они будут достаточны для тебя» (йакфӣка) — конкретные числа наград в тексте хадиса не указаны.",shield:"от зла всего сотворённого, от шайтана-нашёптывателя, от колдовства (дующих на узлы) и от зависти.",source:"Абу Дауд №5082; ат-Тирмизи №3575 («хасан-сахих-гариб»); аль-Альбани — сахих.",row:["У-1 · Ихлас, Фаляк, Нас","утро + вечер","3","«будут достаточны для тебя» (йакфӣка)","от шайтана, колдовства, зависти","Абу Дауд 5082; Тирмизи 3575"]},{id:"u-2",code:"У-2",title:"Сайид аль-истигфар — Господин просьб о прощении",repsShort:"1 раз",arabic:["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ"],translit:"Алла̄хумма анта Раббӣ, ля̄ иля̄ха илля̄ анта, халяктанӣ ва ана̄ ‘абдука, ва ана̄ ‘аля̄ ‘ахдика ва ва‘дика ма̄ стата‘ту. А‘ӯзу бика мин шарри ма̄ сана‘ту, абӯ’у ляка би-ни‘матика ‘аляййа, ва абӯ’у ляка би-занбӣ, фа-гфир лӣ, фа-иннахӯ ля̄ йагфиру-з-зунӯба илля̄ анта.",translation:"«О Аллах! Ты — мой Господь, нет божества, достойного поклонения, кроме Тебя. Ты сотворил меня, и я — Твой раб. Я придерживаюсь Твоего завета и Твоего обещания, насколько могу. Прибегаю к Тебе от зла того, что я совершил. Признаю Твою милость ко мне и признаю свой грех. Прости же меня, ибо, поистине, никто не прощает грехов, кроме Тебя».",when:"утром и вечером",repeats:"1 раз",reward:"«Кто скажет это утром, будучи уверенным в этом, и умрёт в тот же день до вечера — тот из обитателей Рая; и кто скажет это вечером, будучи уверенным, и умрёт в ту же ночь до утра — тот из обитателей Рая».",shield:"прямо не указано; смысл дуа — прощение грехов и признание милости Аллаха.",source:"аль-Бухари №6306 — сахих.",row:["У-2 · Сайид аль-истигфар","утро + вечер","1","Рай, если умрёт в тот день/ту ночь","не указано","Бухари 6306"]},{id:"u-3",code:"У-3",title:"Аллахумма, бика асбахна",repsShort:"1 раз",arabic:["اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ"],translit:"Алла̄хумма бика асбахна̄, ва бика амсайна̄, ва бика нахйа̄, ва бика намӯту, ва иляйка-н-нушӯр.",translation:"«О Аллах! Благодаря Тебе мы встретили утро, благодаря Тебе мы встречаем вечер, благодаря Тебе мы живём, благодаря Тебе мы умираем, и к Тебе — воскрешение».",when:"утром после фаджра (вечером читается вариант «бика амсайна…» — см. В-6)",repeats:"1 раз",reward:"конкретная не указана — общая награда за зикр.",shield:"не указано; признание полной зависимости от Аллаха.",source:"Абу Дауд №5068 — сахих (аль-Альбани).",row:["У-3 · Бика асбахна","утро","1","не указано","не указано","Абу Дауд 5068"]},{id:"u-4",code:"У-4",title:"Аллахумма, ма асбаха би мин ни‘матин",repsShort:"1 раз",arabic:["اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ"],translit:"Алла̄хумма ма̄ асбаха бӣ мин ни‘матин ау би-ах̣адин мин х̣алькика, фа-минка вахдака ля̄ шарӣка ляк, фа-ляка-ль-хамду ва ляка-ш-шукр.",translation:"«О Аллах! Какое бы благо ни оказалось утром у меня или у кого-либо из Твоих творений — оно от Тебя Одного, у Которого нет соучастника. Тебе — хвала и Тебе — благодарность».",when:"утром; вечером слово «асбаха» заменяется на «амса̄»: «Алла̄хумма ма̄ амса̄ бӣ мин ни‘матин…»",repeats:"1 раз",reward:"«Кто скажет это утром — тот выполнил благодарность за этот день; а кто скажет вечером — тот выполнил благодарность за эту ночь».",shield:"не указано.",source:"Абу Дауд №5073 — сахих (аль-Альбани).",row:["У-4 · Ма асбаха би мин ни‘ма","утро (+ вечером: амса̄)","1","благодарность за день/ночь выполнена","не указано","Абу Дауд 5073"]},{id:"u-5",code:"У-5",title:"Субхана-Ллахи ва бихамдихи",repsShort:"100 раз",arabic:["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ"],translit:"Субха̄на-Лла̄хи ва бих̣амдихи.",translation:"«Пречист Аллах и хвала Ему».",when:"утром и вечером (в хадисе — «в течение дня»)",repeats:"100 раз",reward:"«Кто скажет сто раз в день, тому будут прощены его грехи, даже если они подобны пене морской».",shield:"прощение грехов.",source:"Муслим №2692 — сахих.",row:["У-5 · Субхана-Ллахи ва бихамдихи","утро + вечер","100","прощение грехов, даже если их как пена моря","прощение грехов","Муслим 2692"]},{id:"u-6",code:"У-6",title:"Ля иляха илля-Ллаху вахдаху…",repsShort:"100 раз",arabic:["لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"],translit:"Ля̄ иля̄ха илля̄-Лла̄ху вахдаху, ля̄ шарӣка лаху, лаху-ль-мульку ва лаху-ль-хамду, ва хува ‘аля̄ кулли шайъин кадӣр.",translation:"«Нет божества, достойного поклонения, кроме Аллаха, Одного, у Которого нет соучастника. Ему принадлежит власть, и Ему — хвала, и Он над всякой вещью мощен».",when:"утром (и вечером)",repeats:"100 раз",reward:"«…будет подобно освобождению десяти рабов, запишется ему сто добрых дел, сотрётся сто дурных, и никто не придёт с лучшим, кроме сделавшего больше».",shield:"«будет защищён от шайтана в тот день до вечера».",source:"аль-Бухари №6403; Муслим №2691 — сахих.",row:["У-6 · Ля иляха илля-Ллах","утро + вечер","100","10 рабов, 100 добрых, 100 стёрто","от шайтана до вечера","Бухари 6403; Муслим 2691"]},{id:"u-7",code:"У-7",title:"Бисми-Лляхи-ллязи ля йадурру…",repsShort:"3 раза",arabic:["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ"],translit:"Бисми-Лля̄хи-ллязӣ ля̄ йадурру ма‘а исмихи шайъун фӣ-ль-ард̣и ва ля̄ фӣ-с-сама̄’и, ва хува-с-Самӣ‘у-ль-‘Алӣм.",translation:"«С именем Аллаха, с Именем Которого ничто не причинит вреда ни на земле, ни на небесах. И Он — Слышащий, Знающий».",when:"утром и вечером",repeats:"3 раза",reward:"«…ничто не причинит ему вреда»: утром — до вечера, вечером — до утра; не постигнет внезапная беда.",shield:"от всякого вреда на земле и небесах; от внезапной беды.",source:"Абу Дауд №5088; ат-Тирмизи №3388 («хасан-сахих-гариб»); Ибн Маджа №3869 — сахих.",row:["У-7 · Бисми-Лляхи-ллязи…","утро + вечер","3","не указана отдельно","ничто не навредит до вечера/утра","Абу Дауд 5088; Тирмизи 3388"]},{id:"u-8",code:"У-8",title:"Радиту би-Лляхи Раббан…",repsShort:"3 раза",arabic:["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا"],translit:"Радӣту би-Лля̄хи Раббан, ва би-ль-исля̄ми дӣнан, ва би-Мухаммадин ﷺ набиййан.",translation:"«Я доволен Аллахом как Господом, исламом — как религией и Мухаммадом ﷺ — как пророком».",when:"утром и вечером",repeats:"3 раза",reward:"«Кто скажет это трижды утром и трижды вечером — обязанность Аллаха перед ним — сделать его довольным (удовлетворить его) в День воскресения».",shield:"не указано.",source:"Абу Дауд №5072; ат-Тирмизи №3389; ан-Насаи — сахих (аль-Альбани).",row:["У-8 · Радиту би-Лляхи","утро + вечер","3","удовлетворение в Судный день","не указано","Абу Дауд 5072; Тирмизи 3389"]},{id:"u-9",code:"У-9",title:"Аллахумма, инни асбахту ушхидука",repsShort:"4 раза",arabic:["اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ"],translit:"Алла̄хумма иннӣ асбахту ушхидука, ва ушхиду х̣амалата ‘аршика, ва маля̄’икатака, ва джамӣ‘а х̣алькика, аннака анта-Лла̄ху, ля̄ иля̄ха илля̄ анта, вахдака ля̄ шарӣка ляк, ва анна Мух̣аммадан ‘абдука ва расӯлюка.",translation:"«О Аллах! Я встретил утро и призываю Тебя в свидетели, и призываю в свидетели носителей Твоего Трона, Твоих ангелов и все Твои творения, что Ты — Аллах, и нет божества, достойного поклонения, кроме Тебя, Одного, без соучастника, и что Мухаммад — Твой раб и Твой посланник».",when:"утром после фаджра",repeats:"4 раза",reward:"«Сказавший раз — Аллах освободит четверть его от Огня; два раза — половину; три раза — три четверти; четыре раза — Аллах освободит его от Огня целиком».",shield:"освобождение от адского Огня.",source:"Абу Дауд №5069 — сахих (аль-Альбани).",row:["У-9 · Асбахту ушхидука","утро","4","освобождение от Огня (4/4)","от Огня","Абу Дауд 5069"]},{id:"u-10",code:"У-10",title:"Хасбия-Ллаху ля иляха илля хува…",repsShort:"7 раз",arabic:["حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ"],translit:"Х̣асбия-Лла̄ху, ля̄ иля̄ха илля̄ хува, ‘аляйхи таваккалту, ва хува Раббу-ль-‘арши-ль-‘аз̣ӣм.",translation:"«Достаточен мне Аллах, нет божества, достойного поклонения, кроме Него. На Него я уповаю, и Он — Господь Великого Трона».",when:"утром и вечером",repeats:"7 раз",reward:"«Тому, кто скажет это семь раз утром и вечером, Аллах будет достаточен во всём, что его тревожит, из дел этого мира и мира иного».",shield:"от тревог и забот двух миров.",source:"Абу Дауд №5081 — маукуф (слова Абу ад-Дарды) с достоверным иснадом (аль-Альбани); Ибн ас-Сунни «‘Амаль аль-йаум ва-ль-лейля» №71.",row:["У-10 · Хасбия-Ллах","утро + вечер","7","Аллах достаточен во всём, что тревожит","от тревог и забот","Абу Дауд 5081 (маукуф); Ибн ас-Сунни 71"]},{id:"u-11",code:"У-11",title:"Аллахумма, ‘Алима-ль-гайби ва-ш-шахада",repsShort:"1 раз",arabic:["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ"],translit:"Алла̄хумма ‘А̄лима-ль-гайби ва-ш-шаха̄дати, Фа̄т̣ира-с-сама̄ва̄ти ва-ль-ард̣и, Рабба кулли шайъин ва малӣкаху, ашхаду ан ля̄ иля̄ха илля̄ анта. А‘ӯзу бика мин шарри нафсӣ, ва мин шарри-ш-шайт̣а̄ни ва ширкихи, ва ан актарифа ‘аля̄ нафсӣ сӯ’ан, ау аджурраху иля̄ муслимин.",translation:"«О Аллах, Знающий сокровенное и явное, Творец небес и земли, Господь всего и Владыка его! Свидетельствую, что нет божества, достойного поклонения, кроме Тебя. Прибегаю к Тебе от зла моей души, от зла шайтана и его ширка (призыва к многобожию) и от того, чтобы причинить зло самому себе или навлечь его на мусульманина».",when:"утром, вечером и перед сном",repeats:"1 раз",reward:"«Кто скажет это утром, будучи уверенным, и умрёт в тот день — войдёт в Рай; и кто скажет вечером, будучи уверенным, и умрёт в ту ночь — войдёт в Рай».",shield:"от зла собственной души, от шайтана и его ширка, от вреда себе и мусульманину.",source:"Абу Дауд №5067; ат-Тирмизи №3392; аль-Альбани — сахих.",row:["У-11 · ‘Алима-ль-гайби","утро + вечер + сон","1","Рай, если умрёт в тот день/ту ночь","от души, шайтана, ширка","Абу Дауд 5067; Тирмизи 3392"]},{id:"u-12",code:"У-12",title:"Субхана-Ллахи ‘адада халькихи",repsShort:"3 раза",arabic:["سُبْحَانَ اللَّهِ عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ"],translit:"Субха̄на-Лла̄хи ‘адада х̣алькихи, ва рид̣а̄ нафсихи, ва зината ‘аршихи, ва мида̄да калима̄тихи.",translation:"«Пречист Аллах — числом Его творений, по довольству Его души, по весу Его Трона и по запасу чернил для записи Его слов».",when:"утром (Пророк ﷺ научил Джувайрию после её утреннего зикра)",repeats:"3 раза",reward:"«Эти слова перевесят по весу всё, что ты произнесла сегодня» (сказано Пророком ﷺ Джувайрие, да будет доволен ею Аллах).",shield:"не указано.",source:"Муслим №2726 — сахих.",row:["У-12 · ‘Адада халькихи","утро","3","перевешивает весь утренний зикр","не указано","Муслим 2726"]},{id:"u-13",code:"У-13",title:"Аллахумма, инни ас’алюка ‘ильман нафи‘ан",repsShort:"1 раз",arabic:["اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا"],translit:"Алла̄хумма иннӣ ас’алюка ‘ильман на̄фи‘ан, ва ризк̣ан т̣аййибан, ва ‘амалан мутакаббалан.",translation:"«О Аллах! Я прошу у Тебя полезного знания, благого удела и принятого деяния».",when:"утром, после молитвы фаджр",repeats:"1 раз",reward:"конкретная не указана.",shield:"не указано.",source:"Ибн Маджа №925 — сахих (аль-Альбани).",row:["У-13 · ‘Ильман нафи‘ан","после фаджра","1","не указано","не указано","Ибн Маджа 925"]},{id:"u-14",code:"У-14",title:"Аль-хамду ли-Лляхи-ллязи ахйана",repsShort:"1 раз",arabic:["الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ"],translit:"Аль-хамду ли-Лля̄хи-ллязӣ ах̣йа̄на̄ ба‘да ма̄ ама̄тана̄, ва иляйхи-н-нушӯр.",translation:"«Хвала Аллаху, Который оживил нас после того, как умертвил (усыпил), и к Нему — воскрешение».",when:"при пробуждении ото сна",repeats:"1 раз",reward:"конкретная не указана.",shield:"не указано.",source:"аль-Бухари №6312 — сахих.",row:["У-14 · Аль-хамду ли-Лляхи ахйана","пробуждение","1","не указано","не указано","Бухари 6312"]}],p1=[{id:"v-1",code:"В-1",title:"Аят аль-Курси (аль-Бакара, 255)",repsShort:"1 раз",arabic:["اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ"],translit:"Алла̄ху, ля̄ иля̄ха илля̄ хува, аль-Х̣аййу-ль-Каййӯм. Ля̄ та’хузуху синатун ва ля̄ наум. Ляху ма̄ фӣ-с-сама̄ва̄ти ва ма̄ фӣ-ль-ард̣. Ман заллязӣ йашфа‘у ‘индаху илля̄ би-изнихи. Йа‘ляму ма̄ байна айдӣхим ва ма̄ х̣альфахум, ва ля̄ йух̣ӣт̣ӯна би-шайъин мин ‘ильмихи илля̄ би-ма̄ ша̄’. Васиа курсиййуху-с-сама̄ва̄ти ва-ль-ард̣, ва ля̄ йа’ӯдуху х̣ифз̣ухума̄, ва хува-ль-‘Алиййу-ль-‘Аз̣ӣм.",translation:"«Аллах — нет божества, достойного поклонения, кроме Него, Живого, Вседержителя. Им не овладевают ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает их будущее и прошлое. Они постигают из Его знания только то, что Он пожелает. Его Престол объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий».",when:"вечером и перед сном; также после каждого обязательного намаза",repeats:"1 раз",reward:"после каждого обязательного намаза: «ничто не отделяет его от Рая, кроме смерти» (ан-Насаи — сахих).",shield:"«с тобой будет хранитель от Аллаха, и шайтан не приблизится к тебе, пока не наступит утро».",source:"аль-Бухари №2311 — сахих; ан-Насаи «Амаль аль-йаум ва-ль-лейля» №100 — сахих.",row:["В-1 · Аят аль-Курси","вечер + сон + намаз","1","Рай (после намаза — лишь смерть)","хранитель от Аллаха; шайтан не подойдёт до утра","Бухари 2311; Насаи 100"]},{id:"v-2",code:"В-2",title:"Аллахумма, инни ас’алюка-ль-‘афва ва-ль-‘афия",repsShort:"1 раз",arabic:["اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي"],translit:"Алла̄хумма иннӣ ас’алюка-ль-‘афва ва-ль-‘а̄фията фӣ-д-дунйа̄ ва-ль-а̄хирати. Алла̄хумма иннӣ ас’алюка-ль-‘афва ва-ль-‘а̄фията фӣ дӣнӣ ва дунйа̄йа ва ахлӣ ва ма̄лӣ. Алла̄хумма-стур ‘аура̄тӣ ва а̄мин рау‘а̄тӣ. Алла̄хумма-хфаз̣нӣ мин байни йадаййа, ва мин халфӣ, ва ‘ан йамӣнӣ, ва ‘ан шима̄лӣ, ва мин фавк̣ӣ, ва а‘ӯзу би-‘аз̣аматика ан угта̄ла мин тахтӣ.",translation:"«О Аллах! Я прошу у Тебя прощения и благополучия в этом мире и в мире ином. О Аллах! Я прошу у Тебя прощения и благополучия в моей религии, в моих мирских делах, в моей семье и в моём имуществе. О Аллах! Скрой мои недостатки и избавь меня от моих страхов. О Аллах! Охрани меня спереди, сзади, справа, слева и сверху, и я прибегаю к Твоему величию от того, чтобы быть погубленным снизу».",when:"утром и вечером (Пророк ﷺ не оставлял эти слова)",repeats:"1 раз",reward:"конкретная не указана.",shield:"прощение, благополучие, сокрытие недостатков, успокоение страха, защита со всех шести сторон.",source:"Абу Дауд №5074; Ибн Маджа №3871 — сахих.",row:["В-2 · Аль-‘афва ва-ль-‘афия","утро + вечер","1","не указано","защита со всех сторон","Абу Дауд 5074; Ибн Маджа 3871"]},{id:"v-3",code:"В-3",title:"Аллахумма, ‘афини фи бадани…",repsShort:"3 раза",arabic:["اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ"],translit:"Алла̄хумма ‘а̄финӣ фӣ баданӣ. Алла̄хумма ‘а̄финӣ фӣ сам‘ӣ. Алла̄хумма ‘а̄финӣ фӣ бас̣арӣ. Ля̄ иля̄ха илля̄ анта. Алла̄хумма иннӣ а‘ӯзу бика мин-аль-куфри ва-ль-факри, ва а‘ӯзу бика мин ‘аза̄би-ль-кабри. Ля̄ иля̄ха илля̄ анта.",translation:"«О Аллах! Оздорови моё тело! О Аллах! Оздорови мой слух! О Аллах! Оздорови моё зрение! Нет божества, достойного поклонения, кроме Тебя. О Аллах! Я прибегаю к Тебе от неверия и бедности и прибегаю к Тебе от мучений могилы. Нет божества, достойного поклонения, кроме Тебя».",when:"утром и вечером",repeats:"3 раза",reward:"конкретная не указана.",shield:"здоровье тела, слуха и зрения; защита от неверия, бедности и мучений могилы.",source:"Абу Дауд №5090 — сахих (аль-Альбани).",row:["В-3 · ‘Афини фи бадани","утро + вечер","3","не указано","от куфра, бедности, мучений могилы","Абу Дауд 5090"]},{id:"v-4",code:"В-4",title:"А‘узу би-калимати-Лляхи-т-таммати…",repsShort:"3 раза",arabic:["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ"],translit:"А‘ӯзу би-калима̄ти-Лла̄хи-т-та̄мма̄ти мин шарри ма̄ х̣аляк.",translation:"«Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил».",when:"вечером; при остановке на ночлег — в пути и на любом новом месте",repeats:"3 раза вечером; 1 раз при остановке на ночлег",reward:"«…тогда ночное ужаление (ядовитого существа) не повредит ему».",shield:"«ничто не причинит ему вреда, пока он не покинет это место».",source:"Муслим №2708 (при остановке на ночлег); ат-Тирмизи №3604 (3 раза вечером) — сахих.",row:["В-4 · Би-калимати-Лляхи-т-таммати","вечер / ночлег","3","не указано","ничто не навредит; ужаление ночью не повредит","Муслим 2708; Тирмизи 3604"]},{id:"v-5",code:"В-5",title:"Ля иляха илля-Ллаху вахдаху…",repsShort:"10 раз",arabic:["لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"],translit:"Ля̄ иля̄ха илля̄-Лла̄ху вахдаху, ля̄ шарӣка лаху, лаху-ль-мульку ва лаху-ль-хамду, ва хува ‘аля̄ кулли шайъин кадӣр.",translation:"«Нет божества, достойного поклонения, кроме Аллаха, Одного, у Которого нет соучастника. Ему принадлежит власть, и Ему — хвала, и Он над всякой вещью мощен».",when:"вечером (а также утром)",repeats:"10 раз",reward:"«…будет подобно тому, кто освободил четырёх рабов из потомков Исмаила».",shield:"не указано.",source:"аль-Бухари №3293; Муслим №2693 — сахих.",row:["В-5 · Ля иляха илля-Ллах","вечер (+ утро)","10","4 раба из потомков Исмаила","не указано","Бухари 3293; Муслим 2693"]},{id:"v-6",code:"В-6",title:"Аллахумма, бика амсайна",repsShort:"1 раз",arabic:["اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ"],translit:"Алла̄хумма бика амсайна̄, ва бика асбахна̄, ва бика нахйа̄, ва бика намӯту, ва иляйка-ль-масӣр.",translation:"«О Аллах! Благодаря Тебе мы встретили вечер, благодаря Тебе мы встречаем утро, благодаря Тебе мы живём, благодаря Тебе мы умираем, и к Тебе — конечное возвращение».",when:"вечером, перед сном",repeats:"1 раз",reward:"конкретная не указана.",shield:"не указано.",source:"ат-Тирмизи №3391 — сахих (аль-Альбани).",row:["В-6 · Бика амсайна","вечер","1","не указано","не указано","Тирмизи 3391"]},{id:"v-7",code:"В-7",title:"Бисми-Лляхи-ллязи ля йадурру… — вечером",repsShort:"3 раза",arabic:["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ"],translit:"Бисми-Лля̄хи-ллязӣ ля̄ йадурру ма‘а исмихи шайъун фӣ-ль-ард̣и ва ля̄ фӣ-с-сама̄’и, ва хува-с-Самӣ‘у-ль-‘Алӣм.",translation:"«С именем Аллаха, с Именем Которого ничто не причинит вреда ни на земле, ни на небесах. И Он — Слышащий, Знающий».",when:"вечером после магриба",repeats:"3 раза",reward:"«…ничто не причинит ему вреда до утра»; внезапная беда не постигнет.",shield:"от всякого вреда на земле и небесах до утра.",source:"Абу Дауд №5088; ат-Тирмизи №3388 («хасан-сахих-гариб») — сахих.",row:["В-7 · Бисми-Лляхи-ллязи…","вечер","3","не указана отдельно","ничто не навредит до утра","Абу Дауд 5088; Тирмизи 3388"]},{id:"v-8",code:"В-8",title:"Радиту би-Лляхи Раббан… — вечером",repsShort:"3 раза",arabic:["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا"],translit:"Радӣту би-Лля̄хи Раббан, ва би-ль-исля̄ми дӣнан, ва би-Мухаммадин ﷺ набиййан.",translation:"«Я доволен Аллахом как Господом, исламом — как религией и Мухаммадом ﷺ — как пророком».",when:"вечером",repeats:"3 раза",reward:"«Кто скажет это трижды вечером и трижды утром — обязанность Аллаха перед ним — сделать его довольным в День воскресения».",shield:"не указано.",source:"Абу Дауд №5072; ат-Тирмизи №3389; ан-Насаи — сахих (аль-Альбани).",row:["В-8 · Радиту би-Лляхи","вечер","3","удовлетворение в Судный день","не указано","Абу Дауд 5072; Тирмизи 3389"]},{id:"v-9",code:"В-9",title:"Хасбия-Ллаху ля иляха илля хува… — вечером",repsShort:"7 раз",arabic:["حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ"],translit:"Х̣асбия-Лла̄ху, ля̄ иля̄ха илля̄ хува, ‘аляйхи таваккалту, ва хува Раббу-ль-‘арши-ль-‘аз̣ӣм.",translation:"«Достаточен мне Аллах, нет божества, достойного поклонения, кроме Него. На Него я уповаю, и Он — Господь Великого Трона».",when:"вечером",repeats:"7 раз",reward:"«Аллах будет достаточен ему во всём, что его тревожит, из дел этого мира и мира иного».",shield:"от тревог и забот двух миров.",source:"Абу Дауд №5081 — маукуф (слова Абу ад-Дарды) с достоверным иснадом (аль-Альбани); Ибн ас-Сунни «‘Амаль аль-йаум ва-ль-лейля» №71.",row:["В-9 · Хасбия-Ллах","вечер","7","Аллах достаточен во всём, что тревожит","от тревог и забот","Абу Дауд 5081 (маукуф); Ибн ас-Сунни 71"]},{id:"v-10",code:"В-10",title:"Аллахумма, ‘Алима-ль-гайби ва-ш-шахада — вечером",repsShort:"1 раз",arabic:["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ"],translit:"Алла̄хумма ‘А̄лима-ль-гайби ва-ш-шаха̄дати, Фа̄т̣ира-с-сама̄ва̄ти ва-ль-ард̣и, Рабба кулли шайъин ва малӣкаху, ашхаду ан ля̄ иля̄ха илля̄ анта. А‘ӯзу бика мин шарри нафсӣ, ва мин шарри-ш-шайт̣а̄ни ва ширкихи, ва ан актарифа ‘аля̄ нафсӣ сӯ’ан, ау аджурраху иля̄ муслимин.",translation:"«О Аллах, Знающий сокровенное и явное, Творец небес и земли, Господь всего и Владыка его! Свидетельствую, что нет божества, достойного поклонения, кроме Тебя. Прибегаю к Тебе от зла моей души, от зла шайтана и его ширка (призыва к многобожию) и от того, чтобы причинить зло самому себе или навлечь его на мусульманина».",when:"вечером и перед сном",repeats:"1 раз",reward:"«Кто скажет это вечером, будучи уверенным, и умрёт в ту ночь — войдёт в Рай; и кто скажет утром, будучи уверенным, и умрёт в тот день — войдёт в Рай».",shield:"от зла души, от шайтана и его ширка, от вреда себе и мусульманину.",source:"Абу Дауд №5067; ат-Тирмизи №3392; аль-Альбани — сахих.",row:["В-10 · ‘Алима-ль-гайби","вечер + сон","1","Рай, если умрёт в ту ночь/тот день","от души, шайтана, ширка","Абу Дауд 5067; Тирмизи 3392"]},{id:"v-11",code:"В-11",title:"Бисмика-Ллахумма амуту ва ахйа",repsShort:"1 раз",arabic:["بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا"],translit:"Бисмика-Лла̄хумма амӯту ва ах̣йа̄.",translation:"«С Именем Твоим, о Аллах, я умираю (засыпаю) и живу (просыпаюсь)».",when:"перед сном, лёжа на правом боку",repeats:"1 раз",reward:"конкретная не указана.",shield:"не указано.",source:"аль-Бухари №6324 — сахих.",row:["В-11 · Бисмика амуту ва ахйа","перед сном","1","не указано","не указано","Бухари 6324"]},{id:"v-12",code:"В-12",title:"Тасбих Фатимы — 33 + 33 + 34",repsShort:"100 всего",arabic:["سُبْحَانَ اللَّهِ — ٣٣","الْحَمْدُ لِلَّهِ — ٣٣","اللَّهُ أَكْبَرُ — ٣٤"],translit:"Субха̄на-Лла̄хи — 33 раза. Аль-хамду ли-Лля̄хи — 33 раза. Алла̄ху акбар — 34 раза. Всего — 100.",translation:"«Пречист Аллах — 33 раза. Хвала Аллаху — 33 раза. Аллах велик — 34 раза».",when:"перед сном; также после каждого обязательного намаза",repeats:"33 + 33 + 34 = 100",reward:"«Это лучше для вас обоих, чем слуга» (Пророк ﷺ — Фатиме и Али, да будет доволен ими Аллах).",shield:"не указано.",source:"аль-Бухари №3113; Муслим №2727 — сахих.",row:["В-12 · Тасбих Фатимы","сон + намаз","33+33+34","лучше слуги","не указано","Бухари 3113; Муслим 2727"]},{id:"v-13",code:"В-13",title:"Три суры с дуновением в ладони перед сном",repsShort:"3 цикла",arabic:[M1,D1,U1],translit:N1,translation:j1,howto:"сложить ладони, прочитать три суры, слегка дунуть в ладони и протереть ими голову, лицо и всё тело, до чего достанут руки, начиная с головы; повторить весь цикл трижды.",when:"каждую ночь перед сном (так делал Пророк ﷺ)",repeats:"3 цикла: суры → дуновение → протирание",reward:"конкретная не указана.",shield:"защита всего тела; сунна Пророка ﷺ каждую ночь.",source:"аль-Бухари №5017; Муслим №2192 — сахих.",row:["В-13 · Дуновение в ладони","перед сном","3","не указано","защита тела","Бухари 5017; Муслим 2192"]},{id:"v-14",code:"В-14",title:"Аллахумма, инни а‘узу бика мин-аль-хамми…",repsShort:"1 раз",arabic:["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ"],translit:"Алла̄хумма иннӣ а‘ӯзу бика мин-аль-хамми ва-ль-х̣азани, ва-ль-‘аджзи ва-ль-касали, ва-ль-бухли ва-ль-джубни, ва д̣ала‘и-д-дайни ва галябати-р-риджа̄ль.",translation:"«О Аллах! Я прибегаю к Тебе от тревоги и печали, от немощи и лени, от скупости и трусости, от бремени долга и от подавления (власти) людей».",when:"вечером и в любое время",repeats:"1 раз",reward:"конкретная не указана.",shield:"от тревоги, печали, немощи, лени, скупости, трусости, тяжести долгов и притеснения.",source:"аль-Бухари №6369 — сахих.",row:["В-14 · Мин аль-хамми ва-ль-хазани","вечер / любое время","1","не указано","от тревоги, долгов, трусости","Бухари 6369"]}],mv=["Время: утренние — с фаджра до восхода (допустимо до зухра); вечерние — с ‘асра/магриба до первой трети ночи. Пропущенные азкары можно восполнить.","Омовение: для азкаров не обязательно; для чтения Корана желательно; прикасаться к мусхафу без омовения, по мнению большинства учёных, нельзя.","Осквернение (джанаба): азкары и дуа читать можно; читать Коран с намерением чтения — нельзя.","Менструация: азкары и дуа — можно; чтение Корана (по мнению большинства) и прикосновение к мусхафу — нельзя.","Награда и защита: приведены строго по тексту хадисов; где в хадисе их нет — прямо написано «не указано», ничего не выдумано."],rv=["Сахих аль-Бухари — №№ 2311, 3113, 3293, 5017

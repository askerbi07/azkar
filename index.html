قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾

قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾

قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾`,Zd=`Бисми-Лляхи-р-Рахмани-р-Рахим. Куль хува-Ллаху ахад. Аллаху-с-самад. Лям ялид ва лям юляд. Ва лям якун ляху куфуван ахад.

Куль а'узу би-Рабби-ль-фаляк. Мин шарри ма халяк. Ва мин шарри гасикын иза вакаб. Ва мин шарри-н-наффасати фи-ль-'укад. Ва мин шарри хасидин иза хасад.

Куль а'узу би-Рабби-н-нас. Малики-н-нас. Иляхи-н-нас. Мин шарри-ль-васвасы-ль-ханнас. Аллязи ювасвису фи судури-н-нас. Мина-ль-джиннати ва-н-нас.`,Vd=`«Скажи: „Он — Аллах Единый, Аллах Самодостаточный. Не родил и не был рождён, и нет никого, равного Ему“».

«Скажи: „Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла дующих на узлы и от зла завистника, когда он завидует“».

«Скажи: „Прибегаю к защите Господа людей, Царя людей, Бога людей от зла искусителя-шайтана, который нашёптывает в груди людей — из джиннов и из людей“».`,Kd="اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",wd="Аллахумма анта Рабби, ля иляха илля анта, халякта-ни ва ана 'абдука, ва ана 'аля 'ахдика ва ва'дика мастата'ту, а'узу бика мин шарри ма сана'ту, абу'у ляка би-ни'матика 'аляййа, ва абу'у би-занби, фагфир ли, фа-иннаху ля йагфиру-з-зунуба илля анта.",Jd="«О Аллах, Ты — мой Господь, нет божества, кроме Тебя. Ты создал меня, а я — Твой раб, и я верен Твоему завету и обещанию, насколько способен. Прибегаю к Тебе от зла того, что я совершил. Признаю Твою милость ко мне и признаю свой грех — прости же меня, ибо никто, кроме Тебя, не прощает грехов».",kd=`اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَٰهَ إِلَّا أَنْتَ.
اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَٰهَ إِلَّا أَنْتَ`,$d=`Аллахумма 'афини фи бадани, Аллахумма 'афини фи сам'и, Аллахумма 'афини фи басари, ля иляха илля анта.
Аллахумма инни а'узу бика мина-ль-куфри валь-факри, ва а'узу бика мин 'азаби-ль-кабр, ля иляха илля анта.`,Wd=`«О Аллах, даруй благополучие моему телу. О Аллах, даруй благополучие моему слуху. О Аллах, даруй благополучие моему зрению. Нет божества, кроме Тебя.
О Аллах, прибегаю к Тебе от неверия и нищеты и прибегаю к Тебе от мучений в могиле. Нет божества, кроме Тебя».`,Fd="بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",Id="Бисми-Лляхи-ллязи ля ядурру ма'а исмихи шай'ун фи-ль-арди ва ля фи-с-сама'и, ва хува-с-Сами'у-ль-'Алим.",Pd="«С именем Аллаха, с именем Которого ничто на земле и на небе не причинит вреда, и Он — Слышащий, Знающий».",th="رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا",lh="Радыйту би-Лляхи Раббан, ва би-ль-Ислями динан, ва би-Мухаммадин набиййан.",eh="«Я доволен Аллахом как Господом, исламом как религией и Мухаммадом ﷺ как пророком».",ah="اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَىٰ نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَىٰ مُسْلِمٍ",nh="Аллахумма 'Алима-ль-гайби ва-ш-шахадати, Фатыра-с-самаваати ва-ль-арди, Рабба кулли шай'ин ва Малика-ху, ашхаду алля иляха илля Анта, а'узу бика мин шарри нафси, ва мин шарри-ш-шайтани ва ширкихи, ва ан актарифа 'аля нафси су'ан ау аджурраху иля муслим.",uh="«О Аллах, Ведающий сокрытое и явное, Творец небес и земли, Господь всякой вещи и Владыка её! Свидетельствую, что нет божества, кроме Тебя. Прибегаю к Тебе от зла моей души, от зла шайтана и его многобожия и от того, чтобы совершить зло против самого себя или навлечь его на мусульманина».",ih="اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",ch="Аллахумма инни ас'алюка-ль-'афва валь-'афийата фи-д-дунья валь-ахира. Аллахумма инни ас'алюка-ль-'афва валь-'афийата фи дини ва дунйайа ва ахли ва мали. Аллахумма-стур 'аурати ва амин рау'ати. Аллахумма-хфазни мин байни йадаййа ва мин халфи ва 'ан йамини ва 'ан шимали ва мин фауки, ва а'узу би-'азаматика ан угталя мин тахти.",fh="«О Аллах, прошу Тебя о прощении и благополучии в этом мире и в последней жизни. О Аллах, прошу Тебя о прощении и благополучии в моей религии, моей земной жизни, моей семье и моём имуществе. О Аллах, прикрой мои недостатки и успокой мои тревоги. О Аллах, храни меня спереди, сзади, справа, слева и сверху, и прибегаю к Твоему величию от того, чтобы быть поражённым снизу».",U0="اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",R0="Аллаху ля иляха илля хува-ль-Хаййу-ль-Каййум. Ля та'хузуху синатун ва ля наум. Ляху ма фи-с-самаваати ва ма фи-ль-ард. Ман за-ллязи яшфа'у 'индаху илля би-изнихи. Я'ляму ма байна айдихим ва ма халфахум. Ва ля юхытуна би-шай'ин мин 'ильмихи илля би-ма ша'. Васи'а курсиййуху-с-самаваати ва-ль-ард. Ва ля я'удуху хифзухума. Ва хува-ль-'Алиййу-ль-'Азым.",H0="«Аллах — нет божества, кроме Него, Живого, Вечносущего. Не овладевают Им ни дремота, ни сон. Ему принадлежит всё, что на небесах и на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает, что было перед ними и что будет после них, а они не постигают из Его знания ничего, кроме того, что Он пожелает. Престол Его объемлет небеса и землю, и не тяготит Его охрана их. Он — Возвышенный, Великий».",nl=[{code:"У-1",id:"z-u1",period:"morning",title:"Три суры: аль-Ихлас, аль-Фаляк, ан-Нас",arabic:Ld,translit:Zd,translation:Vd,time:"Утром (и вечером)",count:"3 раза",reward:Y,protection:"«Они достаточны тебе от всего» — слова Пророка ﷺ",source:"Абу Дауд 5082; ат-Тирмизи 3575; ан-Насаи",grade:"хасан",summary:"Достаточно от всего",targetCount:3,category:"quran",categoryLabel:"Суры Корана",pairCode:"В-13",hadithContext:"Передаётся от Абдуллаха ибн Хубайба (да будет доволен им Аллах), что Посланник Аллаха ﷺ сказал ему: «Читай „Куль хува-Ллаху ахад“ и две предохраняющие суры (аль-Му’аввизатайн) вечером и утром по три раза — и их будет достаточно тебе от всякой вещи».",keyTerms:[{arabic:"الصَّمَدُ",translit:"ас-Самад",meaning:"Самодостаточный Владыка, в Котором нуждаются все творения"},{arabic:"الْفَلَقِ",translit:"аль-Фаляк",meaning:"Утренний рассвет, рассекающий ночную тьму"},{arabic:"الْوَسْوَاسِ الْخَنَّاسِ",translit:"аль-васвас аль-ханнас",meaning:"Искуситель, отступающий при поминании Аллаха"}]},{code:"У-2",id:"z-u2",period:"morning",title:"Сайид аль-истигфар — господин прошения о прощении",arabic:Kd,translit:wd,translation:Jd,time:"Утром (и вечером)",count:"1 раз",countNote:"Число повторов в хадисе не оговорено: сказано «кто скажет это».",reward:"Кто скажет это днём с твёрдой убеждённостью и умрёт до вечера — из обитателей Рая; так же и ночью — до утра",protection:Y,source:"аль-Бухари 6306",grade:"сахих",summary:"Рай для сказавшего с убеждённостью и умершего в тот же день",targetCount:1,category:"istighfar",categoryLabel:"Покаяние",pairCode:"В-2",hadithContext:"Передаётся от Шаддада ибн Ауса (да будет доволен им Аллах), что Пророк ﷺ назвал эту мольбу «Сайид аль-истигфар» (главой мольбы о прощении), так как она соединяет полное признание Господства Аллаха, рабства человека, благодарность за милости и смиренное признание греха.",keyTerms:[{arabic:"عَهْدِكَ وَوَعْدِكَ",translit:"'ахдика ва ва'дика",meaning:"Твой завет (присяга веры) и Твоё обещание (награды за единобожие)"},{arabic:"أَبُوءُ لَكَ بِنِعْمَتِكَ",translit:"абу'у ляка би-ни'матика",meaning:"Искренне признаю и подтверждаю Твою милость ко мне"},{arabic:"فَاغْفِرْ لِي",translit:"фагфир ли",meaning:"Прости же меня (покрой мой грех и не взыщи за него)"}]},{code:"У-3",id:"z-u3",period:"morning",title:"«Асбахна ва асбаха-ль-мульку ли-Лляхи…»",arabic:`أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ.
رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَٰذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَٰذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ`,translit:`Асбахна ва асбаха-ль-мульку ли-Лляхи, валь-хамду ли-Лляхи, ля иляха илля-Ллаху вахдаху ля шарика ляху, ляху-ль-мульку ва ляху-ль-хамду ва хува 'аля кулли шай'ин кадир.
Рабби ас'алюка хайра ма фи хаза-ль-яуми ва хайра ма ба'дах, ва а'узу бика мин шарри ма фи хаза-ль-яуми ва шарри ма ба'дах. Рабби а'узу бика мина-ль-касали ва су'и-ль-кибар. Рабби а'узу бика мин 'азабин фи-н-нар ва 'азабин фи-ль-кабр.`,translation:`«Мы встретили утро, и власть принадлежит Аллаху, хвала Аллаху. Нет божества, кроме одного Аллаха, у Которого нет сотоварища. Ему принадлежит власть, и Ему — хвала, и Он над всем властен.
Господи, прошу Тебя о благе этого дня и о благе того, что после него, и прибегаю к Тебе от зла этого дня и зла того, что после него. Господи, прибегаю к Тебе от лени и от немощной старости. Господи, прибегаю к Тебе от мучения в Огне и мучения в могиле».`,time:"Утром",count:"1 раз",countNote:"Число повторов в хадисе не оговорено: описана практика Пророка ﷺ.",reward:Y,protection:Y,source:"Муслим 2723",grade:"сахих (Муслим)",summary:"Просьба о благе дня и защите от зла; награда не указана",targetCount:1,category:"tawhid",categoryLabel:"Единобожие и дуа",pairCode:"В-3",hadithContext:"Передаётся от Абдуллаха ибн Мас’уда (да будет доволен им Аллах). В утренней версии говорится «Асбахна… хаза-ль-яум» (мы встретили утро… этого дня), а в вечерней (В-3) — «Амсайна… хазихи-ль-ляйля» (мы встретили вечер… этой ночи).",keyTerms:[{arabic:"أَصْبَحْنَا",translit:"асбахна",meaning:"Мы вступили в утро (по милости Аллаха)"},{arabic:"الْكَسَلِ",translit:"аль-касаль",meaning:"Лень и отсутствие решимости в благих делах"},{arabic:"سُوءِ الْكِبَرِ",translit:"су'и-ль-кибар",meaning:"Дряхлость, немощность и потеря рассудка в старости"}]},{code:"У-4",id:"z-u4",period:"morning",title:"«Аллахумма бика асбахна ва бика амсайна…»",arabic:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",translit:"Аллахумма бика асбахна, ва бика амсайна, ва бика нахйа, ва бика намуту, ва иляйка-н-нушур.",translation:"«О Аллах, с Тобой мы встретили утро, с Тобой мы встретили вечер, с Тобой мы живём, с Тобой умираем, и к Тебе — воскрешение».",time:"Утром",count:"1 раз",countNote:"Число повторов в хадисе не оговорено.",reward:Y,protection:Y,source:"ат-Тирмизи 3391; Абу Дауд 5068; Ибн Маджа 3868",grade:"сахих",summary:"Утреннее признание зависимости от Аллаха; награда не указана",targetCount:1,category:"tawhid",categoryLabel:"Упование",pairCode:"В-4",hadithContext:"Передаётся от Абу Хурайры (да будет доволен им Аллах). Утром завершается словами «ва иляйка-н-нушур» (и к Тебе — воскрешение/рассеяние после пробуждения, подобного малой смерти), а вечером (В-4) — «ва иляйка-ль-масир» (и к Тебе — возвращение).",keyTerms:[{arabic:"بِكَ أَصْبَحْنَا",translit:"бика асбахна",meaning:"Твоей поддержкой, милостью и защитой мы встретили утро"},{arabic:"النُّشُورُ",translit:"ан-нушур",meaning:"Воскрешение и выход из могил в Судный день"}]},{code:"У-5",id:"z-u5",period:"morning",title:"Просьба о благополучии тела, слуха и зрения",arabic:kd,translit:$d,translation:Wd,time:"Утром и вечером",count:"3 раза",reward:Y,protection:Y,source:"Абу Дауд 5090",grade:"хасан",summary:"Просьба о благополучии; награда не указана",targetCount:3,category:"protection",categoryLabel:"Благополучие",pairCode:"В-5",hadithContext:"Абдуррахман ибн Абу Бакра спросил своего отца: «О отец, я слышу, как ты каждое утро и каждый вечер повторяешь эти слова по три раза». Отец ответил: «Я слышал, как Посланник Аллаха ﷺ произносил их, и я люблю следовать его сунне».",keyTerms:[{arabic:"عَافِنِي",translit:"'афини",meaning:"Даруй мне здоровье, сохранность и избавление от недугов"},{arabic:"الْكُفْرِ وَالْفَقْرِ",translit:"аль-куфри валь-факр",meaning:"Неверие (гибель религии) и нищета (испытание в мирском)"}]},{code:"У-6",id:"z-u6",period:"morning",title:"«Бисми-Лляхи-ллязи ля ядурру ма'а исмихи шай'ун…»",arabic:Fd,translit:Id,translation:Pd,time:"Утром (и вечером)",count:"3 раза",reward:Y,protection:"Сказавший утром — не будет поражён внезапной бедой до вечера; сказавший вечером — до утра",source:"Абу Дауд 5088; ат-Тирмизи 3388; Ибн Маджа 3869",grade:"сахих",summary:"Защита от внезапной беды до вечера",targetCount:3,category:"protection",categoryLabel:"Защита",pairCode:"В-6",hadithContext:"Передаётся от Усмана ибн Аффана (да будет доволен им Аллах). В версии Абу Дауда сказано: «Кто произнесёт эти слова трижды утром, того не постигнет внезапная беда до вечера, а кто произнесёт их трижды вечером — до утра».",keyTerms:[{arabic:"لَا يَضُرُّ",translit:"ля ядурру",meaning:"Ничто не способно причинить вред"},{arabic:"السَّمِيعُ الْعَلِيمُ",translit:"ас-Сами'у-ль-'Алим",meaning:"Всеслышащий (слышит мольбу) и Всезнающий (ведает обо всём)"}]},{code:"У-7",id:"z-u7",period:"morning",title:"«Радыйту би-Лляхи Раббан…» — довольство Господом, исламом и Пророком",arabic:th,translit:lh,translation:eh,time:"Утром и вечером",count:"3 раза",reward:"Аллах обязал Себя (по Своей милости) удовлетворить сказавшего в День воскресения",protection:Y,source:"Абу Дауд 5072; ат-Тирмизи 3389; Ибн Маджа 3870; Ахмад",grade:"хасан",summary:"Довольство Аллаха в День воскресения",targetCount:3,category:"tawhid",categoryLabel:"Довольство верой",pairCode:"В-7",hadithContext:"Эти три основы — фундамент веры раба и ответы на три вопроса в могиле: кто твой Господь, какова твоя религия и кто твой Пророк. Шейх аль-Альбани оценил цепочку как хасан; ряд учёных также исследовал нюансы её иснада.",keyTerms:[{arabic:"رَضِيتُ",translit:"радыйту",meaning:"Я полностью доволен, спокоен сердцем и принял с радостью"},{arabic:"رَبًّا",translit:"Раббан",meaning:"Как единственного Господа, Творца, Кормильца и Управителя"}]},{code:"У-8",id:"z-u8",period:"morning",title:"«Я Хаййу, я Каййум, би-рахматика астагис…»",arabic:"يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَىٰ نَفْسِي طَرْفَةَ عَيْنٍ",translit:"Я Хаййу, я Каййум, би-рахматика астагис, аслих ли ша'ни куллаху, ва ля такилни иля нафси тарфата 'айн.",translation:"«О Живой, о Вечносущий, к Твоей милости взываю о помощи. Исправь все мои дела и не оставляй меня на мою душу ни на мгновение ока».",time:"Утром и вечером",count:Y,reward:Y,protection:Y,source:"аль-Хаким; ан-Насаи («‘Амаль аль-йаум валь-ляйля»)",grade:"хасан",summary:"Мольба об исправлении всех дел; награда не указана",targetCount:1,category:"tawhid",categoryLabel:"Упование",hadithContext:"Передаётся от Анаса ибн Малика (да будет доволен им Аллах), что Пророк ﷺ завещал своей дочери Фатыме (да будет доволен ею Аллах) не оставлять эти слова утром и вечером. Число повторов в самом хадисе не оговорено.",keyTerms:[{arabic:"يَا حَيُّ يَا قَيُّومُ",translit:"Я Хаййу, я Каййум",meaning:"О Вечно Живой, о Вседержитель, поддерживающий бытие всего сущего"},{arabic:"أَسْتَغِيثُ",translit:"астагис",meaning:"Ищу спасения и скорой помощи в нужде"},{arabic:"طَرْفَةَ عَيْنٍ",translit:"тарфата 'айн",meaning:"На одно моргание глаза (мгновение ока)"}]},{code:"У-9",id:"z-u9",period:"morning",title:"«Субхана-Лляхи ва би-хамдихи» — сто раз",arabic:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",translit:"Субхана-Лляхи ва би-хамдихи.",translation:"«Пречист Аллах и хвала Ему».",time:"Утром и вечером",count:"100 раз",reward:"В День воскресения никто не принесёт ничего лучшего, кроме того, кто сказал то же или больше. По другой версии (сто раз в день) грехи прощаются, даже если подобны морской пене",protection:Y,source:"Муслим 2692, 2691",grade:"сахих (Муслим)",summary:"В День воскресения — лучшее из принесённого, кроме сказавшего столько же или больше",targetCount:100,category:"tawhid",categoryLabel:"Тасбих (100 раз)",hadithContext:"В «Сахихе» Муслима (2692) от Абу Хурайры передаётся: «Кто скажет утром и вечером „Субхана-Лляхи ва би-хамдихи“ сто раз, в День воскресения никто не придёт с чем-либо лучшим, чем то, с чем пришёл он, кроме того, кто скажет столько же или добавит к этому».",keyTerms:[{arabic:"سُبْحَانَ اللَّهِ",translit:"Субхана-Лляхи",meaning:"Пречист Аллах от всякого недостатка и несовершенства"},{arabic:"وَبِحَمْدِهِ",translit:"ва би-хамдихи",meaning:"И Ему принадлежит совершенная хвала за Его качества и милости"}]},{code:"У-10",id:"z-u10",period:"morning",title:"«Ля иляха илля-Ллаху вахдаху ля шарика ляху…»",arabic:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ",translit:"Ля иляха илля-Ллаху вахдаху ля шарика ляху, ляху-ль-мульку ва ляху-ль-хамду ва хува 'аля кулли шай'ин кадир.",translation:"«Нет божества, кроме одного Аллаха, у Которого нет сотоварища. Ему принадлежит власть, и Ему — хвала, и Он над всем властен».",time:"Утром (и вечером)",count:"1 раз",countNote:"В хадисе Абу Айяша число не оговорено. По хадису, переданному аль-Бухари и Муслимом, — 100 раз в течение дня.",reward:"Как освобождение раба из потомков Исмаила; записывается 10 благих деяний, стирается 10 грехов, повышается на 10 степеней",protection:"Защита от шайтана до вечера (сказавшему вечером — до утра)",source:"Абу Дауд 5077; Ибн Маджа 3867; аль-Бухари 3293; Муслим 2691",grade:"сахих",summary:"Награда как за освобождение раба; защита от шайтана до вечера",targetCount:1,altTargetCount:100,category:"tawhid",categoryLabel:"Тахлиль",hadithContext:"В хадисе Абу Айяша аз-Зураки (Абу Дауд 5077) говорится о произнесении этих слов утром и вечером (1 раз) с наградой освобождения раба и защитой от шайтана. А в хадисе аль-Бухари (3293) и Муслима (2691) за произнесение 100 раз в день обещана награда как за освобождение 10 рабов, 100 благих дел и стирание 100 грехов.",keyTerms:[{arabic:"لَا شَرِيكَ لَهُ",translit:"ля шарика ляху",meaning:"Нет у Него сотоварища ни в господстве, ни в поклонении, ни в именах"},{arabic:"لَهُ الْمُلْكُ",translit:"ляху-ль-мульк",meaning:"Ему принадлежит абсолютная власть над небесами и землёй"}]},{code:"У-11",id:"z-u11",period:"morning",title:"«Аллахумма 'Алима-ль-гайби ва-ш-шахада…»",arabic:ah,translit:nh,translation:uh,time:"Утром, вечером и перед сном",count:"1 раз",countNote:"Число повторов в хадисе не оговорено.",reward:Y,protection:Y,source:"Абу Дауд 5067; ат-Тирмизи 3392",grade:"сахих",summary:"Прибежище от зла души и шайтана; награда не указана",targetCount:1,category:"protection",categoryLabel:"Защита сердца",pairCode:"В-8",hadithContext:"Абу Бакр ас-Сиддик (да будет доволен им Аллах) попросил: «О Посланник Аллаха, научи меня словам, которые я буду произносить утром и вечером». Пророк ﷺ обучил его этой великой мольбе и сказал: «Произноси их утром, вечером и когда ложишься в постель».",keyTerms:[{arabic:"الْغَيْبِ وَالشَّهَادَةِ",translit:"аль-гайби ва-ш-шахада",meaning:"Сокрытое от взоров творений и явное, открытое им"},{arabic:"فَاطِرَ",translit:"Фатыр",meaning:"Первосоздатель, сотворивший небеса и землю без предшествующего образца"}]},{code:"У-12",id:"z-u12",period:"morning",title:"Мольба о прощении и благополучии («аль-‘афв валь-‘афийа»)",arabic:ih,translit:ch,translation:fh,time:"Утром и вечером",count:"1 раз",countNote:"Число повторов в хадисе не оговорено: Пророк ﷺ «не оставлял эти слова утром и вечером».",reward:Y,protection:"Просьба о защите со всех сторон; сама защита как следствие хадисом не уточняется — не указано",source:"Абу Дауд 5074; Ибн Маджа 3871",grade:"сахих",summary:"Просьба о прощении, благополучии и защите; награда не указана",targetCount:1,category:"protection",categoryLabel:"Благополучие",pairCode:"В-9",hadithContext:"Ибн Умар (да будет доволен Аллах им и его отцом) передал: «Посланник Аллаха ﷺ никогда не оставлял эти слова обращения к Аллаху утром и вечером». Учёные отмечают, что эта мольба охватывает защиту со всех шести сторон.",keyTerms:[{arabic:"الْعَفْوَ وَالْعَافِيَةَ",translit:"аль-'афва валь-'афийа",meaning:"Стирание прежних грехов ('афв) и защита от будущих бед в религии и теле ('афийа)"},{arabic:"اسْتُرْ عَوْرَاتِي",translit:"устур 'аурати",meaning:"Скрой мои упущения и недостатки"}]},{code:"У-13",id:"z-u13",period:"morning",title:"«Асбахна 'аля фитрати-ль-Ислям…»",arabic:"أَصْبَحْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ، وَعَلَىٰ دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَىٰ مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",translit:"Асбахна 'аля фитрати-ль-Ислям, ва 'аля калимати-ль-ихляс, ва 'аля дини набиййина Мухаммад ﷺ, ва 'аля миллати абина Ибрахима ханифан муслиман ва ма кана мина-ль-мушрикин.",translation:"«Мы встретили утро на природе Ислама, на слове искренности, на религии нашего пророка Мухаммада ﷺ и на вере нашего отца Ибрахима — ханифа, мусульманина; он не был из многобожников».",time:"Утром",count:"1 раз",countNote:"Число повторов в хадисе не оговорено.",reward:Y,protection:Y,source:"Ахмад",grade:"сахих",summary:"Утреннее утверждение веры; награда не указана",targetCount:1,category:"tawhid",categoryLabel:"Утверждение веры",hadithContext:"Передаётся от Абдуррахмана ибн Абзы (да будет доволен им Аллах), что Пророк ﷺ произносил эти слова с наступлением утра, обновляя приверженность первозданному единобожию (фитре) и слову искренности («Ля иляха илля-Ллах»).",keyTerms:[{arabic:"فِطْرَةِ الْإِسْلَامِ",translit:"фитрати-ль-Ислям",meaning:"Естественное первозданное единобожие, на котором Аллах создал людей"},{arabic:"كَلِمَةِ الْإِخْلَاصِ",translit:"калимати-ль-ихляс",meaning:"Слово искренности — свидетельство «Ля иляха илля-Ллах»"},{arabic:"حَنِيفًا",translit:"ханифан",meaning:"Искренне устремлённый к единобожию и отвернувшийся от всякого ширка"}]},{code:"У-14",id:"z-u14",period:"morning",title:"«Аллахумма ма асбаха би мин ни'матин…» — благодарность за милости",arabic:"اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",translit:"Аллахумма ма асбаха би мин ни'матин ау би-ахадин мин халкыка, фа-мин-ка вахдака ля шарика ляк, фа-ляка-ль-хамду ва ляка-ш-шукр.",translation:"«О Аллах, всякая милость, оказавшаяся утром со мной или с кем-либо из Твоих созданий, — только от Тебя одного, нет у Тебя сотоварища. Тебе хвала и Тебе благодарность».",time:"Утром",count:"1 раз",countNote:"Число повторов в хадисе не оговорено.",reward:"Сказавший утром — выполнил долг благодарности за этот день",protection:Y,source:"Абу Дауд 5073; ан-Насаи («‘Амаль аль-йаум валь-ляйля»)",grade:"хасан",summary:"Исполнен долг благодарности за день",targetCount:1,category:"gratitude",categoryLabel:"Благодарность",pairCode:"В-10",hadithContext:"Признание того, что каждое благо — от Аллаха Единого, является основой благодарности (шукр). Примечание учёных: хадис приведён у Абу Дауда (5073); шейх аль-Альбани в поздних проверках указывал на слабость иснада, тогда как Ибн аль-Каййим и Ибн Баз считали его хорошим (хасан).",keyTerms:[{arabic:"نِعْمَةٍ",translit:"ни'матин",meaning:"Любая милость, дар, благополучие и надел (ризк)"},{arabic:"الْحَمْدُ وَلَكَ الشُّكْرُ",translit:"аль-хамду ва ляка-ш-шукр",meaning:"Тебе хвала языком и благодарность сердцем и делами"}]},{code:"В-1",id:"z-v1",period:"evening",title:"Аят аль-Курси",arabic:U0,translit:R0,translation:H0,time:"Вечером (и перед сном)",count:"1 раз",countNote:"Число повторов в хадисах не оговорено.",reward:Y,protection:"Сказавший вечером защищён от джиннов до утра; читающий перед сном — Аллах приставит хранителя, и шайтан не приблизится до утра",source:"аль-Бухари 2311, 3275; ан-Насаи («‘Амаль аль-йаум валь-ляйля»)",grade:"сахих",summary:"Защита от джиннов и шайтана до утра",targetCount:1,category:"quran",categoryLabel:"Величайший аят",hadithContext:"Сура «аль-Бакара», аят 255 — величайший аят Книги Аллаха. Также достоверно установлено чтение Аята аль-Курси утром, вечером, перед сном и после каждой обязательной молитвы.",keyTerms:[{arabic:"الْحَيُّ الْقَيُّومُ",translit:"аль-Хаййу-ль-Каййум",meaning:"Вечно Живой и Самодостаточный Вседержитель"},{arabic:"سِنَةٌ",translit:"синатун",meaning:"Лёгкая дремота, предшествующая сну"},{arabic:"كُرْسِيُّهُ",translit:"курсиййуху",meaning:"Престол Аллаха, объемлющий небеса и землю"}]},{code:"В-2",id:"z-v2",period:"evening",title:"Сайид аль-истигфар — господин прошения о прощении",arabic:Kd,translit:wd,translation:Jd,time:"Вечером (и утром)",count:"1 раз",countNote:"Число повторов в хадисе не оговорено: сказано «кто скажет это».",reward:"Кто скажет это ночью с твёрдой убеждённостью и умрёт до утра — из обитателей Рая",protection:Y,source:"аль-Бухари 6306",grade:"сахих",summary:"Рай для сказавшего с убеждённостью и умершего до утра",targetCount:1,category:"istighfar",categoryLabel:"Покаяние",pairCode:"У-2",hadithContext:"Вечернее чтение «Сайид аль-истигфар» подводит итог прожитому дню: верующий благодарит Господа за дарованные милости и просит прощения за допущенные упущения перед наступлением ночи.",keyTerms:[{arabic:"مَا اسْتَطَعْتُ",translit:"мастата'ту",meaning:"По мере моих сил и возможностей (признание человеческой слабости)"},{arabic:"أَبُوءُ بِذَنْبِي",translit:"абу'у би-занби",meaning:"Признаю свой грех, не оправдываясь перед Тобой"}]},{code:"В-3",id:"z-v3",period:"evening",title:"«Амсайна ва амса-ль-мульку ли-Лляхи…»",arabic:`أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ.
رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَٰذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَٰذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ`,translit:`Амсайна ва амса-ль-мульку ли-Лляхи, валь-хамду ли-Лляхи, ля иляха илля-Ллаху вахдаху ля шарика ляху, ляху-ль-мульку ва ляху-ль-хамду ва хува 'аля кулли шай'ин кадир.
Рабби ас'алюка хайра ма фи хазихи-ль-ляйляти ва хайра ма ба'даха, ва а'узу бика мин шарри ма фи хазихи-ль-ляйляти ва шарри ма ба'даха. Рабби а'узу бика мина-ль-касали ва су'и-ль-кибар. Рабби а'узу бика мин 'азабин фи-н-нар ва 'азабин фи-ль-кабр.`,translation:`«Мы встретили вечер, и власть принадлежит Аллаху, хвала Аллаху. Нет божества, кроме одного Аллаха, у Которого нет сотоварища. Ему принадлежит власть, и Ему — хвала, и Он над всем властен.
Господи, прошу Тебя о благе этой ночи и о благе того, что после неё, и прибегаю к Тебе от зла этой ночи и зла того, что после неё. Господи, прибегаю к Тебе от лени и от немощной старости. Господи, прибегаю к Тебе от мучения в Огне и мучения в могиле».`,time:"Вечером",count:"1 раз",countNote:"Число повторов в хадисе не оговорено: описана практика Пророка ﷺ.",reward:Y,protection:Y,source:"Муслим 2723",grade:"сахих (Муслим)",summary:"Просьба о благе ночи и защите от зла; награда не указана",targetCount:1,category:"tawhid",categoryLabel:"Единобожие и дуа",pairCode:"У-3",hadithContext:"Вечерняя форма зикра из хадиса Ибн Мас’уда в «Сахихе» Муслима. Здесь слова «Асбахна… хаза-ль-яум» меняются на «Амсайна… хазихи-ль-ляйля» (мы встретили вечер… в эту ночь).",keyTerms:[{arabic:"أَمْسَيْنَا",translit:"амсайна",meaning:"Мы вступили в вечернее время"},{arabic:"هَٰذِهِ اللَّيْلَةِ",translit:"хазихи-ль-ляйля",meaning:"Этой наступившей ночи"}]},{code:"В-4",id:"z-v4",period:"evening",title:"«Аллахумма бика амсайна ва бика асбахна…»",arabic:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",translit:"Аллахумма бика амсайна, ва бика асбахна, ва бика нахйа, ва бика намуту, ва иляйка-ль-масир.",translation:"«О Аллах, с Тобой мы встретили вечер, с Тобой мы встретили утро, с Тобой мы живём, с Тобой умираем, и к Тебе — возвращение».",time:"Вечером",count:"1 раз",countNote:"Число повторов в хадисе не оговорено.",reward:Y,protection:Y,source:"ат-Тирмизи 3391; Абу Дауд 5068; Ибн Маджа 3868",grade:"сахих",summary:"Вечернее признание зависимости от Аллаха; награда не указана",targetCount:1,category:"tawhid",categoryLabel:"Упование",pairCode:"У-4",hadithContext:"В вечерней версии на первое место выносится «бика амсайна» (с Тобой мы встретили вечер), а завершается словами «ва иляйка-ль-масир» (и к Тебе — конечное возвращение), напоминая о предстоящем сне и возвращении к Господу.",keyTerms:[{arabic:"الْمَصِيرُ",translit:"аль-масир",meaning:"Конечное место возвращения и прибытия к Аллаху"}]},{code:"В-5",id:"z-v5",period:"evening",title:"Просьба о благополучии тела, слуха и зрения",arabic:kd,translit:$d,translation:Wd,time:"Вечером (и утром)",count:"3 раза",reward:Y,protection:Y,source:"Абу Дауд 5090",grade:"хасан",summary:"Просьба о благополучии; награда не указана",targetCount:3,category:"protection",categoryLabel:"Благополучие",pairCode:"У-5",hadithContext:"Читается трижды вечером так же, как и утром. Слух и зрение выделены особо после упоминания всего тела, так как они являются главными путями познания, размышления и восприятия откровения.",keyTerms:[{arabic:"سَمْعِي وَبَصَرِي",translit:"сам'и ва басари",meaning:"Мой слух и моё зрение — две величайшие милости восприятия"}]},{code:"В-6",id:"z-v6",period:"evening",title:"«Бисми-Лляхи-ллязи ля ядурру ма'а исмихи шай'ун…»",arabic:Fd,translit:Id,translation:Pd,time:"Вечером (и утром)",count:"3 раза",reward:Y,protection:"Сказавший вечером — не будет поражён внезапной бедой до утра",source:"Абу Дауд 5088; ат-Тирмизи 3388; Ибн Маджа 3869",grade:"сахих",summary:"Защита от внезапной беды до утра",targetCount:3,category:"protection",categoryLabel:"Защита",pairCode:"У-6",hadithContext:"Вечернее трёхкратное произнесение этого зикра служит щитом верующего с наступления вечера и до самого утра.",keyTerms:[{arabic:"فِي الْأَرْضِ وَلَا فِي السَّمَاءِ",translit:"фи-ль-арди ва ля фи-с-сама'",meaning:"Ни на земле, ни на небесах (охватывает всё мироздание)"}]},{code:"В-7",id:"z-v7",period:"evening",title:"«Радыйту би-Лляхи Раббан…» — довольство Господом, исламом и Пророком",arabic:th,translit:lh,translation:eh,time:"Вечером (и утром)",count:"3 раза",reward:"Аллах обязал Себя (по Своей милости) удовлетворить сказавшего в День воскресения",protection:Y,source:"Абу Дауд 5072; ат-Тирмизи 3389; Ибн Маджа 3870; Ахмад",grade:"хасан",summary:"Довольство Аллаха в День воскресения",targetCount:3,category:"tawhid",categoryLabel:"Довольство верой",pairCode:"У-7",hadithContext:"Трёхкратное подтверждение довольства Аллахом как Господом, Исламом как религией и Мухаммадом ﷺ как пророком в вечернее время.",keyTerms:[{arabic:"وَبِالْإِسْلَامِ دِينًا",translit:"ва би-ль-Ислями динан",meaning:"И доволен Исламом как образом жизни и законоположением"}]},{code:"В-8",id:"z-v8",period:"evening",title:"«Аллахумма 'Алима-ль-гайби ва-ш-шахада…»",arabic:ah,translit:nh,translation:uh,time:"Вечером (утром и перед сном)",count:"1 раз",countNote:"Число повторов в хадисе не оговорено.",reward:Y,protection:Y,source:"Абу Дауд 5067; ат-Тирмизи 3392",grade:"сахих",summary:"Прибежище от зла души и шайтана; награда не указана",targetCount:1,category:"protection",categoryLabel:"Защита сердца",pairCode:"У-11",hadithContext:"В этой мольбе верующий ищет защиты от двух главных источников духовного вреда: от зла собственной души (нафса) и от наущений шайтана и его ловушек.",keyTerms:[{arabic:"شَرِّ نَفْسِي",translit:"шарри нафси",meaning:"Зло собственной души, склонной к слабости и страстям"}]},{code:"В-9",id:"z-v9",period:"evening",title:"Мольба о прощении и благополучии («аль-‘афв валь-‘афийа»)",arabic:ih,translit:ch,translation:fh,time:"Вечером (и утром)",count:"1 раз",countNote:"Число повторов в хадисе не оговорено: Пророк ﷺ «не оставлял эти слова утром и вечером».",reward:Y,protection:"Просьба о защите со всех сторон; сама защита как следствие хадисом не уточняется — не указано",source:"Абу Дауд 5074; Ибн Маджа 3871",grade:"сахих",summary:"Просьба о прощении, благополучии и защите; награда не указана",targetCount:1,category:"protection",categoryLabel:"Благополучие",pairCode:"У-12",hadithContext:"Неизменная вечерняя и утренняя мольба Пророка ﷺ, объединяющая просьбу о благополучии в религии, мирской жизни, семье и имуществе.",keyTerms:[{arabic:"آمِنْ رَوْعَاتِي",translit:"амин рау'ати",meaning:"Успокой мои страхи и даруй безопасность от тревог"}]},{code:"В-10",id:"z-v10",period:"evening",title:"«Аллахумма ма амса би мин ни'матин…» — благодарность за милости",arabic:"اللَّهُمَّ مَا أَمْسَىٰ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",translit:"Аллахумма ма амса би мин ни'матин ау би-ахадин мин халкыка, фа-мин-ка вахдака ля шарика ляк, фа-ляка-ль-хамду ва ляка-ш-шукр.",translation:"«О Аллах, всякая милость, оказавшаяся вечером со мной или с кем-либо из Твоих созданий, — только от Тебя одного, нет у Тебя сотоварища. Тебе хвала и Тебе благодарность».",time:"Вечером",count:"1 раз",countNote:"Число повторов в хадисе не оговорено.",reward:"Сказавший вечером — выполнил долг благодарности за эту ночь",protection:Y,source:"Абу Дауд 5073; ан-Насаи («‘Амаль аль-йаум валь-ляйля»)",grade:"хасан",summary:"Исполнен долг благодарности за ночь",targetCount:1,category:"gratitude",categoryLabel:"Благодарность",pairCode:"У-14",hadithContext:"Вечерняя форма зикра благодарности (отличается от утренней У-14 словом «ма амса би» — «что оказалось со мной вечером» вместо «ма асбаха би»).",keyTerms:[{arabic:"مَا أَمْسَىٰ بِي",translit:"ма амса би",meaning:"Всё то, с чем я встретил этот вечер из благ и милостей"}]},{code:"В-11",id:"z-v11",period:"evening",title:"«Бисмика-Ллахумма амуту ва ахйа»",arabic:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",translit:"Бисмика-Ллахумма амуту ва ахйа.",translation:"«С Твоим именем, о Аллах, я умираю и оживаю».",time:"Перед сном, когда ложитесь в постель",count:Y,reward:Y,protection:Y,source:"аль-Бухари 6324",grade:"сахих (аль-Бухари)",summary:"Слова Пророка ﷺ перед сном; число и награда не указаны",targetCount:1,category:"sleep",categoryLabel:"Перед сном",hadithContext:"Передаётся от Хузайфы ибн аль-Йамана (да будет доволен им Аллах), что Пророк ﷺ, ложась спать ночью, клал руку под щёку и говорил: «Бисмика-Ллахумма амуту ва ахйа». Сон в исламской традиции именуется малой смертью.",keyTerms:[{arabic:"أَمُوتُ وَأَحْيَا",translit:"амуту ва ахйа",meaning:"Умираю (засыпая) и оживаю (пробуждаясь по Твоей воле)"}]},{code:"В-12",id:"z-v12",period:"evening",title:"Тасбих Фатимы: 33 + 33 + 34",arabic:`سُبْحَانَ اللَّهِ  (٣٣)
الْحَمْدُ لِلَّهِ  (٣٣)
اللَّهُ أَكْبَرُ  (٣٤)`,translit:`Субхана-Лляхи — 33 раза
Аль-хамду ли-Лляхи — 33 раза
Аллаху акбар — 34 раза`,translation:`«Пречист Аллах» — 33 раза.
«Хвала Аллаху» — 33 раза.
«Аллах велик» — 34 раза.`,time:"Перед сном, когда ложитесь в постель",count:"33 + 33 + 34 раза",reward:"«Это лучше для вас, чем слуга» — слова Пророка ﷺ Али и Фатыме",protection:Y,source:"аль-Бухари 3113, 5361; Муслим 2727",grade:"сахих (аль-Бухари, Муслим)",summary:"Лучше, чем слуга (по словам Пророка ﷺ)",targetCount:100,stages:[{arabic:"سُبْحَانَ اللَّهِ",translit:"Субхана-Лляхи",translation:"Пречист Аллах",target:33},{arabic:"الْحَمْدُ لِلَّهِ",translit:"Аль-хамду ли-Лляхи",translation:"Хвала Аллаху",target:33},{arabic:"اللَّهُ أَكْبَرُ",translit:"Аллаху акбар",translation:"Аллах велик",target:34}],category:"sleep",categoryLabel:"Перед сном (100)",hadithContext:"Когда Фатыма (да будет доволен ею Аллах) пожаловалась на усталость от ручной мельницы и попросила у Пророка ﷺ слугу, он научил её и Али этому зикру перед сном, сказав: «Разве не указать мне вам на то, что лучше для вас, чем слуга? Когда ляжете в постель, скажите: Субхана-Ллах 33 раза, Аль-хамду ли-Ллях 33 раза и Аллаху акбар 34 раза».",keyTerms:[{arabic:"سُبْحَانَ اللَّهِ",translit:"Субхана-Ллах",meaning:"Пречист Аллах (33 раза)"},{arabic:"الْحَمْدُ لِلَّهِ",translit:"Аль-хамду ли-Ллях",meaning:"Хвала Аллаху (33 раза)"},{arabic:"اللَّهُ أَكْبَرُ",translit:"Аллаху акбар",meaning:"Аллах превыше всего и велик (34 раза)"}]},{code:"В-13",id:"z-v13",period:"evening",title:"Три суры: аль-Ихлас, аль-Фаляк, ан-Нас",arabic:Ld,translit:Zd,translation:Vd,time:"Вечером (3 раза); перед сном — с дуновением в сложенные ладони и обтиранием тела",count:"3 раза",reward:Y,protection:"«Они достаточны тебе от всего» — слова Пророка ﷺ (о чтении вечером и утром)",source:"Абу Дауд 5082; ат-Тирмизи 3575; ан-Насаи; аль-Бухари 5017 (перед сном)",grade:"хасан",summary:"Достаточно от всего; перед сном — с обтиранием тела",targetCount:3,category:"quran",categoryLabel:"Суры Корана",pairCode:"У-1",hadithContext:"Помимо трёхкратного чтения вечером, Аиша (да будет доволен ею Аллах) передала (аль-Бухари 5017), что Пророк ﷺ каждую ночь, ложась в постель, соединял ладони, слегка дул в них, читал эти три суры, а затем проводил ладонями по всему телу, куда мог дотянуться, начиная с головы и лица, и повторял это трижды.",keyTerms:[{arabic:"الْمُعَوِّذَات",translit:"аль-Му'аввизат",meaning:"Суры, посредством которых ищут прибежища и защиты у Аллаха"}]},{code:"В-14",id:"z-v14",period:"evening",title:"«А'узу би-калимати-Лляхи-т-таммати мин шарри ма халяк»",arabic:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",translit:"А'узу би-калимати-Лляхи-т-таммати мин шарри ма халяк.",translation:"«Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил».",time:"Вечером",count:"3 раза",reward:Y,protection:"Не причинит вреда (в хадисе — укус скорпиона) в ту ночь",source:"Муслим 2709; ат-Тирмизи 3604; Ибн Маджа 3518",grade:"сахих (Муслим)",summary:"Защита от вреда (яд скорпиона) в ту ночь",targetCount:3,category:"protection",categoryLabel:"Защита ночью",hadithContext:"В «Сахихе» Муслима (2709) передаётся, что к Пророку ﷺ пришёл человек и сказал: «О Посланник Аллаха, чего я только не натерпелся от скорпиона, ужалившего меня вчера ночью!». Он ответил: «Если бы ты сказал вечером: „А’узу би-калимати-Лляхи-т-таммати мин шарри ма халяк“, он не причинил бы тебе вреда». У ат-Тирмизи (3604) указано число: три раза.",keyTerms:[{arabic:"كَلِمَاتِ اللَّهِ التَّامَّاتِ",translit:"калимати-Лляхи-т-таммат",meaning:"Совершенные слова Аллаха, в которых нет ни изъяна, ни недостатка"}]}],B0=[{number:1,text:"Поминание Аллаха — одно из самых любимых деяний раба. Всевышний повелел верующим поминать Его часто и особо назвал два времени суток — утро и вечер.",arabic:"يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا ﴿٤١﴾ وَسَبِّحُوهُ بُكْرَةً وَأَصِيلًا ﴿٤٢﴾",russian:"«О те, которые уверовали! Поминайте Аллаха многократным поминанием и восславляйте Его утром и вечером».",cite:"Коран, 33:41–42 (смысловой перевод)"},{number:2,text:"Утро и вечер — начало и завершение дня. Пророк ﷺ учил своих сподвижников словам, которыми можно встретить день и ночь: прося у Аллаха прощения, благополучия и защиты, прославляя Его и благодаря за милости.",arabic:"وَاذْكُر رَّبَّكَ فِي نَفْسِكَ تَضَرُّعًا وَخِيفَةً وَدُونَ الْجَهْرِ مِنَ الْقَوْلِ بِالْغُدُوِّ وَالْآصَالِ وَلَا تَكُن مِّنَ الْغَافِلِينَ",russian:"«Поминай своего Господа в душе своей со смирением и страхом, без громкого голоса, утром и вечером, и не будь одним из беспечных».",cite:"Коран, 7:205 (смысловой перевод)"},{number:3,text:"Сердце обретает покой в поминании Аллаха. В подборке — 28 зикров, переданных в хадисах; к каждому указаны источник и оценка. Если в хадисе нет числа повторов, награды или защиты, мы пишем «не указано».",arabic:"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",russian:"«Разве не поминанием Аллаха успокаиваются сердца?»",cite:"Коран, 13:28 (смысловой перевод)"}],q0=[{title:"Время",text:"Утренние азкары читают с наступления утра (с фаджра), лучше до восхода солнца; вечерние — после послеполуденной молитвы (аср) и до захода солнца. Учёные расходятся в границах: некоторые допускают читать утренние до полудня, а вечерние — до середины ночи. Если пропустили, прочтите, как только вспомнили."},{title:"Омовение",text:"Для зикров омовение не является условием, но с ним лучше. Читать аяты по памяти можно и без омовения; прикасаться к мусхафу без омовения нельзя (мнение большинства учёных)."},{title:"Джанаба (большая нечистота)",text:"Зикры, не являющиеся Кораном, можно читать. По мнению большинства учёных, аяты Корана (Аят аль-Курси, три суры) нужно отложить до гусля. В вопросе есть разногласия — обратитесь к учёному."},{title:"Менструация и послеродовые выделения",text:"Зикры, не являющиеся Кораном, читать можно. Относительно коранических зикров мнения расходятся: ряд учёных (в том числе маликиты и, из позднейших, Ибн Таймия) разрешает чтение по памяти, без прикосновения к мусхафу; другие запрещают."},{title:"Честность с «не указано»",text:"Если в хадисе не названо число повторов, награда или защита, в карточке стоит «не указано». Мы ничего не додумываем. Градации аль-Альбани приведены по его трудам; сайт — не фетва, поэтому при сомнении сверяйтесь с изданиями и учёными."}],Y0=[["Сахих аль-Бухари","Сборник Мухаммада аль-Бухари (ум. 256 г.х.) — наиболее достоверная книга после Корана."],["Сахих Муслим","Сборник Муслима ибн аль-Хаджаджа (ум. 261 г.х.)."],["Сунан Абу Дауда","Сборник Абу Дауда ас-Сиджистани (ум. 275 г.х.)."],["Джами' ат-Тирмизи","Сборник Мухаммада ат-Тирмизи (ум. 279 г.х.)."],["Сунан Ибн Маджи","Сборник Ибн Маджи аль-Казвини (ум. 273 г.х.)."],["Сунан ан-Насаи","Сборник Ахмада ан-Насаи (ум. 303 г.х.)."],["«‘Амаль аль-йаум валь-ляйля»","Книга ан-Насаи о зикрах дня и ночи."],["Муснад Ахмада","Сборник имама Ахмада ибн Ханбаля (ум. 241 г.х.)."],["аль-Мустадрак аль-Хакима","Сборник аль-Хакима ан-Нисабури (ум. 405 г.х.)."],["«Сахих ат-Таргиб ва-т-Тархиб»","Труд аль-Альбани: проверка хадисов о поощрении и предостережении."],["«Сахих и Да'иф» сунанов и «Сахих аль-Джами'» аль-Альбани","Оценки хадисов (сахих / хасан / да'иф), которые приведены в карточках."]];function sh(h){return String(h).toLowerCase().replace(/ё/g,"е").replace(/[\u0640\u064B-\u065F\u0670\u06D6-\u06ED]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[ʼʻ'’‘`´]/g,"").replace(/[«»„“”"()\-–—]/g," ").replace(/\s+/g," ").trim()}const w=({name:h,className:C="icon"})=>{switch(h){case"sun":return c.jsxs("svg",{className:C,viewBox:"0 0 24 24","aria-hidden":"true",children:[c.jsx("circle",{cx:"12",cy:"12",r:"4"}),c.jsx("path",{d:"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"})]});case"moon":return c.jsx("svg",{className:C,viewBox:"0 0 24 24","aria-hidden":"true",children:c.jsx("path",{d:"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"})});case"check":return c.jsx("svg",{className:C,viewBox:"0 0 24 24","aria-hidden":"true",children:c.jsx("path",{d:"M20 6 9 17l-5-5"})});case"copy":return c.jsxs("svg",{className:C,viewBox:"0 0 24 24",
